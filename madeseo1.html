<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>made Seo - 유통 관리 시스템</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪙</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, 'Pretendard', 'Apple SD Gothic Neo', sans-serif; background: #F8F8FA; }
  input, select, button { font-family: inherit; }
  input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }
</style>
</head>
<body>
<div id="root"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<!-- React -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

<script>
// ============================================================
// 🔥 여기에 Firebase 설정을 입력하세요!
// Firebase Console > 프로젝트 설정 > 일반 > 내 앱 > 구성
// ============================================================
const firebaseConfig = {
  apiKey: "여기에-입력",
  authDomain: "여기에-입력.firebaseapp.com",
  databaseURL: "https://여기에-입력-default-rtdb.firebaseio.com",
  projectId: "여기에-입력",
  storageBucket: "여기에-입력.appspot.com",
  messagingSenderId: "여기에-입력",
  appId: "여기에-입력"
};
// ============================================================

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
</script>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ===== Firebase DB helpers =====
const fbRef = (path) => db.ref(path);
const fbSet = (path, val) => fbRef(path).set(val);
const fbGet = async (path) => { const snap = await fbRef(path).once("value"); return snap.val(); };
const fbListen = (path, cb) => { const ref = fbRef(path); ref.on("value", snap => cb(snap.val())); return () => ref.off("value"); };

const TYPES = [
  { key: "bar", label: "실버바", emoji: "🪙" },
  { key: "3n", label: "그래뉼3N", emoji: "⚪" },
  { key: "4n", label: "그래뉼4N", emoji: "✨" },
];
const QKG = [1, 2, 3, 5, 10];
const O = "#FF6F0F", OL = "#FFF5EF";
const G = "#22C55E", GL = "#F0FDF4", R = "#EF4444", RL = "#FEF2F2";
const B = "#3B82F6", BL = "#EFF6FF", BG_ = "#F8F8FA", W = "#FFF";
const T1 = "#0F172A", T2 = "#475569", T3 = "#94A3B8", BD = "#E2E8F0";

const fmt = n => n == null || isNaN(n) ? "0" : n === 0 ? "0" : Number.isInteger(n) ? n.toLocaleString() : n.toFixed(1);
const td = () => new Date().toISOString().slice(0, 10);
const mkSet = (id, name) => ({ id, name, unit: 10, partners: [{ name: "투자자1", share: 40, invested: 0 }, { name: "투자자2", share: 35, invested: 0 }, { name: "투자자3", share: 25, invested: 0 }], viewers: [], sales: [], settlements: [] });

const card = { background: W, borderRadius: 20, boxShadow: "0 1px 3px rgba(0,0,0,0.06)", overflow: "hidden", marginBottom: 14 };
const inpS = (c = T1) => ({ width: "100%", padding: "13px 14px", background: "#F8FAFC", border: `1.5px solid ${BD}`, borderRadius: 14, color: c, fontSize: 16, fontWeight: 600, outline: "none", boxSizing: "border-box", WebkitAppearance: "none" });
const btnS = (bg = O, c = W) => ({ width: "100%", padding: "16px", borderRadius: 16, border: "none", background: bg, color: c, fontSize: 16, fontWeight: 800, cursor: "pointer", textAlign: "center" });
const lb = { fontSize: 12, color: T3, marginBottom: 4, fontWeight: 700, letterSpacing: 0.3 };

function autoSettle(s) {
  const totalKg = (s.sales || []).reduce((a, x) => a + (x.kg || 0), 0);
  const needed = Math.floor(totalKg / s.unit);
  const curLen = (s.settlements || []).length;
  if (needed > curLen) {
    const ns = [...(s.settlements || [])];
    let cumKg = 0, rs = {};
    for (const sale of (s.sales || [])) { cumKg += sale.kg || 0; const r = Math.min(Math.floor((cumKg - 0.001) / s.unit), needed - 1); if (!rs[r]) rs[r] = { sell: 0, cost: 0 }; rs[r].sell += sale.sell || 0; rs[r].cost += sale.cost || 0; }
    for (let i = curLen; i < needed; i++) { const r = rs[i] || { sell: 0, cost: 0 }; ns.push({ id: Date.now() + i, sellAmt: r.sell, costAmt: r.cost, auto: true }); }
    return { ...s, settlements: ns };
  }
  return s;
}

function calcSettle(partners, sellAmt, costAmt) {
  const profit = sellAmt - costAmt;
  return (partners || []).map(p => {
    const profitShare = profit * ((p.share || 0) / 100);
    return { ...p, investedReturn: p.invested || 0, profitShare, total: (p.invested || 0) + profitShare };
  });
}

// ========= Firebase 연결 체크 =========
function FirebaseCheck({ children }) {
  const [ok, setOk] = useState(null);
  useEffect(() => {
    const t = setTimeout(() => setOk(false), 5000);
    fbRef(".info/connected").once("value", snap => { clearTimeout(t); setOk(true); }).catch(() => { clearTimeout(t); setOk(false); });
    return () => clearTimeout(t);
  }, []);

  if (ok === null) return <div style={{ minHeight: "100vh", background: "#FAFAFA", display: "flex", alignItems: "center", justifyContent: "center" }}><div style={{ textAlign: "center" }}><div style={{ fontSize: 40, marginBottom: 16 }}>🪙</div><div style={{ fontSize: 16, color: T3 }}>서버 연결 중...</div></div></div>;
  if (ok === false) return <div style={{ minHeight: "100vh", background: "#FAFAFA", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}><div style={{ textAlign: "center", maxWidth: 380 }}><div style={{ fontSize: 40, marginBottom: 16 }}>⚠️</div><div style={{ fontSize: 18, fontWeight: 800, color: T1, marginBottom: 8 }}>Firebase 연결 실패</div><div style={{ fontSize: 14, color: T2, lineHeight: 1.8 }}>index.html 파일의 firebaseConfig 설정을 확인하세요.<br/>Firebase Console에서 Realtime Database를 활성화했는지 확인하세요.</div></div></div>;
  return children;
}

// ========= LOGIN =========
function Login({ onLogin }) {
  const [mode, setMode] = useState(null);
  const [pw, setPw] = useState("");
  const [code, setCode] = useState("");
  const [err, setErr] = useState("");

  useEffect(() => { (async () => { const p = await fbGet("admin_pw"); if (!p) await fbSet("admin_pw", "silver1234"); })(); }, []);

  const aLogin = async () => { const p = await fbGet("admin_pw"); p === pw ? onLogin({ role: "admin" }) : setErr("비밀번호가 틀립니다"); };
  const vLogin = async () => {
    if (!code.trim()) { setErr("코드를 입력하세요"); return; }
    const d = await fbGet("sets");
    if (d) { const sets = Object.values(d); if (sets.some(s => (s.viewers || []).some(v => v.code === code.trim().toUpperCase()))) { onLogin({ role: "viewer", code: code.trim().toUpperCase() }); return; } }
    setErr("등록되지 않은 코드");
  };

  return (
    <div style={{ minHeight: "100vh", background: "#FAFAFA", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "24px 20px" }}>
      <div style={{ width: "100%", maxWidth: 380 }}>
        <div style={{ textAlign: "center", marginBottom: mode === null ? 56 : 40 }}>
          <div style={{ fontSize: 15, fontWeight: 600, color: T3, letterSpacing: 6, textTransform: "uppercase", marginBottom: 10 }}>Silver Distribution</div>
          <div style={{ fontSize: 38, fontWeight: 900, color: T1, letterSpacing: -2 }}>made Seo</div>
          <div style={{ width: 40, height: 3, background: O, borderRadius: 2, margin: "14px auto 0" }} />
          <div style={{ marginTop: 12, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
            <span style={{ width: 8, height: 8, borderRadius: 4, background: G }} />
            <span style={{ fontSize: 12, color: G, fontWeight: 600 }}>실시간 연동</span>
          </div>
        </div>
        {mode === null ? (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {[["admin", "관리자", "판매 · 정산 · 계정 관리"], ["viewer", "투자자", "거래 기록 · 현황 확인"]].map(([m, t, d]) => (
              <button key={m} onClick={() => setMode(m)} style={{ width: "100%", padding: "22px 24px", borderRadius: 18, border: `1.5px solid ${BD}`, background: W, cursor: "pointer", textAlign: "left", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                <div><div style={{ fontSize: 18, fontWeight: 800, color: T1, marginBottom: 3 }}>{t}</div><div style={{ fontSize: 13, color: T3 }}>{d}</div></div>
                <span style={{ fontSize: 22, color: T3 }}>→</span>
              </button>
            ))}
          </div>
        ) : (
          <div>
            <button onClick={() => { setMode(null); setErr(""); }} style={{ background: "none", border: "none", color: T3, cursor: "pointer", fontSize: 14, fontWeight: 600, padding: "0 0 16px" }}>← 뒤로</button>
            <div style={{ fontSize: 22, fontWeight: 900, color: T1, marginBottom: 6 }}>{mode === "admin" ? "관리자 로그인" : "투자자 접속"}</div>
            <div style={{ fontSize: 14, color: T3, marginBottom: 28 }}>{mode === "admin" ? "비밀번호를 입력하세요" : "접속 코드를 입력하세요"}</div>
            <input type={mode === "admin" ? "password" : "text"} value={mode === "admin" ? pw : code}
              onChange={e => mode === "admin" ? setPw(e.target.value) : setCode(e.target.value.toUpperCase())}
              placeholder={mode === "admin" ? "비밀번호" : "접속 코드"}
              onKeyDown={e => e.key === "Enter" && (mode === "admin" ? aLogin() : vLogin())}
              style={{ width: "100%", padding: "18px 20px", background: W, border: `1.5px solid ${BD}`, borderRadius: 16, color: T1, fontSize: mode === "admin" ? 20 : 22, fontWeight: mode === "admin" ? 600 : 700, outline: "none", boxSizing: "border-box", marginBottom: 16, ...(mode === "viewer" ? { letterSpacing: 4, fontFamily: "monospace", textAlign: "center" } : {}) }} />
            <button onClick={mode === "admin" ? aLogin : vLogin} style={{ width: "100%", padding: "18px", borderRadius: 16, border: "none", background: T1, color: W, fontSize: 17, fontWeight: 800, cursor: "pointer" }}>{mode === "admin" ? "로그인" : "접속"}</button>
            {err && <div style={{ color: R, fontSize: 15, textAlign: "center", marginTop: 16, fontWeight: 700 }}>{err}</div>}
          </div>
        )}
      </div>
    </div>
  );
}

// ===== SALES TAB (공유) =====
function SalesTab({ s, canEdit, onSave, partnerNames }) {
  const [qKg, setQKg] = useState(1), [qType, setQType] = useState("bar");
  const sales = s.sales || [], settlements = s.settlements || [];
  const totalKg = sales.reduce((a, x) => a + (x.kg || 0), 0);
  const totalSell = sales.reduce((a, x) => a + (x.sell || 0), 0);
  const totalCost = sales.reduce((a, x) => a + (x.cost || 0), 0);
  const profit = totalSell - totalCost;
  const rounds = Math.floor(totalKg / s.unit), progress = totalKg % s.unit;
  let cum = 0;
  const sd = sales.map(x => { cum += x.kg || 0; return { ...x, cum, rd: cum > 0 ? Math.ceil(cum / s.unit) : 0, pg: cum > 0 ? (cum % s.unit === 0 ? s.unit : cum % s.unit) : 0 }; });
  const addSale = (kg) => { const ns = [...sales, { id: Date.now(), type: qType, kg, cost: 0, sell: 0, date: td(), trader: "", location: "" }]; const u = autoSettle({ ...s, sales: ns }); onSave({ sales: u.sales, settlements: u.settlements }); };
  const uf = (id, f, v) => { const ns = sales.map(x => x.id === id ? { ...x, [f]: v } : x); const u = autoSettle({ ...s, sales: ns }); onSave({ sales: u.sales, settlements: u.settlements }); };
  const locs = [...new Set(sales.map(x => x.location).filter(Boolean))];

  return (
    <React.Fragment>
    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 14 }}>
      <div style={{ ...card, marginBottom: 0, padding: "16px 18px", background: `linear-gradient(135deg, ${OL}, #FFF)` }}><div style={{ fontSize: 12, color: T3, fontWeight: 700, marginBottom: 6 }}>총 판매량</div><div style={{ fontSize: 28, fontWeight: 900, color: O }}>{totalKg}<span style={{ fontSize: 15 }}>kg</span></div><div style={{ fontSize: 13, color: T3, marginTop: 4 }}>매출 <b style={{ color: B }}>{fmt(totalSell)}만</b></div></div>
      <div style={{ ...card, marginBottom: 0, padding: "16px 18px", background: profit >= 0 ? `linear-gradient(135deg, ${GL}, #FFF)` : `linear-gradient(135deg, ${RL}, #FFF)` }}><div style={{ fontSize: 12, color: T3, fontWeight: 700, marginBottom: 6 }}>순이익</div><div style={{ fontSize: 28, fontWeight: 900, color: profit >= 0 ? G : R }}>{fmt(profit)}<span style={{ fontSize: 15 }}>만</span></div><div style={{ fontSize: 13, color: T3, marginTop: 4 }}>원가 <b style={{ color: R }}>{fmt(totalCost)}만</b></div></div>
    </div>
    <div style={{ ...card, padding: "18px 20px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 12 }}><div><span style={{ fontSize: 18, fontWeight: 900, color: T1 }}>{rounds + 1}회차</span><span style={{ fontSize: 13, color: T3, marginLeft: 8 }}>정산완료 <b style={{ color: G }}>{rounds}회</b></span></div><span style={{ fontSize: 20, fontWeight: 900, color: O }}>{progress}<span style={{ color: T3, fontWeight: 500 }}>/{s.unit}kg</span></span></div>
      <div style={{ height: 12, background: "#F1F5F9", borderRadius: 6, overflow: "hidden" }}><div style={{ width: `${s.unit > 0 ? (progress / s.unit) * 100 : 0}%`, height: "100%", background: `linear-gradient(90deg, ${O}, #FBBF24)`, borderRadius: 6, transition: "width 0.3s" }} /></div>
    </div>
    {canEdit && <div style={{ ...card, padding: 20 }}>
      <div style={{ fontSize: 18, fontWeight: 900, color: T1, marginBottom: 16 }}>판매 추가</div>
      <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>{TYPES.map(t => <button key={t.key} onClick={() => setQType(t.key)} style={{ flex: 1, padding: "12px 6px", borderRadius: 14, border: qType === t.key ? `2.5px solid ${O}` : `1.5px solid ${BD}`, background: qType === t.key ? OL : W, color: qType === t.key ? O : T3, fontSize: 14, fontWeight: 700, cursor: "pointer" }}>{t.emoji} {t.label}</button>)}</div>
      <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>{QKG.map(k => <button key={k} onClick={() => setQKg(k)} style={{ flex: 1, padding: "14px 0", borderRadius: 14, border: "none", background: qKg === k ? O : "#F1F5F9", color: qKg === k ? W : T2, fontSize: 18, fontWeight: 900, cursor: "pointer" }}>{k}</button>)}</div>
      <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 16 }}><span style={{ fontSize: 14, color: T3, fontWeight: 600 }}>직접입력</span><input type="number" inputMode="decimal" value={qKg} onChange={e => setQKg(parseFloat(e.target.value) || 0)} style={{ ...inpS(O), width: 90, textAlign: "center", padding: "12px 8px" }} /><span style={{ fontSize: 16, fontWeight: 700, color: T2 }}>kg</span></div>
      <button onClick={() => addSale(qKg)} style={{ ...btnS(), fontSize: 17, padding: "17px" }}>{TYPES.find(t => t.key === qType)?.emoji} {qKg}kg 추가</button>
    </div>}
    {totalKg > 0 && <div style={{ display: "flex", gap: 8, marginBottom: 14, overflowX: "auto" }}>{TYPES.map(t => { const items = sales.filter(x => x.type === t.key); if (!items.length) return null; const kg = items.reduce((a, x) => a + (x.kg || 0), 0); const p = items.reduce((a, x) => a + (x.sell || 0) - (x.cost || 0), 0); return <div key={t.key} style={{ flexShrink: 0, ...card, marginBottom: 0, padding: "10px 14px", fontSize: 13, fontWeight: 600, display: "flex", gap: 8, alignItems: "center" }}>{t.emoji} {t.label} <span style={{ color: T3 }}>{kg}kg</span> <span style={{ color: p >= 0 ? G : R }}>{fmt(p)}만</span></div>; })}</div>}
    <div style={card}>
      <div style={{ padding: "16px 20px", borderBottom: `1px solid ${BD}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <span style={{ fontSize: 18, fontWeight: 900, color: T1 }}>거래 내역 <span style={{ color: T3, fontWeight: 500, fontSize: 15 }}>{sales.length}</span></span>
        {canEdit && sales.length > 0 && <button onClick={() => { if (window.confirm("전체 초기화?")) onSave({ sales: [], settlements: [] }); }} style={{ padding: "8px 16px", borderRadius: 12, border: `1.5px solid ${BD}`, background: W, color: R, cursor: "pointer", fontSize: 13, fontWeight: 700 }}>초기화</button>}
      </div>
      {sales.length === 0 ? <div style={{ padding: 50, textAlign: "center", color: T3, fontSize: 16 }}>아직 거래 기록이 없습니다</div> : <div>
        {sd.map((x, i) => { const done = x.cum > 0 && x.cum % s.unit === 0; const tI = TYPES.find(t => t.key === x.type) || TYPES[0]; const pr = (x.sell || 0) - (x.cost || 0); return (
          <div key={x.id || i} style={{ padding: "16px 18px", borderBottom: done ? `3px solid ${G}` : `1px solid #F1F5F9`, background: done ? GL : W }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ width: 28, height: 28, borderRadius: 14, background: done ? G : "#F1F5F9", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 900, color: done ? W : T3 }}>{i + 1}</span>
                {canEdit ? <div style={{ display: "flex", gap: 3 }}>{TYPES.map(t => <button key={t.key} onClick={() => uf(x.id, "type", t.key)} style={{ padding: "4px 10px", borderRadius: 10, border: x.type === t.key ? `2px solid ${O}` : `1px solid ${BD}`, background: x.type === t.key ? OL : "#FAFAFA", cursor: "pointer", color: x.type === t.key ? O : T3, fontSize: 12, fontWeight: 700 }}>{t.emoji}</button>)}</div> : <span style={{ fontSize: 15, fontWeight: 700 }}>{tI.emoji} {tI.label}</span>}
                <span style={{ fontWeight: 900, fontSize: 18, color: T1 }}>{x.kg}kg</span>
                {done && <span style={{ background: G, color: W, fontSize: 11, padding: "3px 10px", borderRadius: 8, fontWeight: 800 }}>정산✓</span>}
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ background: pr >= 0 ? GL : RL, color: pr >= 0 ? G : R, fontWeight: 800, fontSize: 14, padding: "5px 12px", borderRadius: 10 }}>{pr >= 0 ? "+" : ""}{fmt(pr)}만</span>
                {canEdit && <button onClick={() => { const u = autoSettle({ ...s, sales: sales.filter(y => y.id !== x.id), settlements: [] }); onSave({ sales: u.sales, settlements: u.settlements }); }} style={{ background: "none", border: "none", color: "#CBD5E1", cursor: "pointer", fontSize: 20 }}>✕</button>}
              </div>
            </div>
            {canEdit ? <React.Fragment>
              <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
                <div style={{ flex: 1 }}><div style={lb}>판매량(kg)</div><input type="number" inputMode="decimal" value={x.kg || ""} placeholder="0" onChange={e => uf(x.id, "kg", parseFloat(e.target.value) || 0)} style={{ ...inpS(O), padding: "10px" }} /></div>
                <div style={{ flex: 1 }}><div style={lb}>원가(만원)</div><input type="number" inputMode="decimal" step="0.1" value={x.cost || ""} placeholder="0" onChange={e => uf(x.id, "cost", parseFloat(e.target.value) || 0)} style={{ ...inpS(R), padding: "10px" }} /></div>
                <div style={{ flex: 1 }}><div style={lb}>판매가(만원)</div><input type="number" inputMode="decimal" step="0.1" value={x.sell || ""} placeholder="0" onChange={e => uf(x.id, "sell", parseFloat(e.target.value) || 0)} style={{ ...inpS(G), padding: "10px" }} /></div>
              </div>
              <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
                <div style={{ flex: 1 }}><div style={lb}>거래자</div><select value={x.trader || ""} onChange={e => uf(x.id, "trader", e.target.value)} style={{ ...inpS(T1), padding: "10px", fontSize: 14, color: x.trader ? T1 : T3 }}><option value="">선택</option>{partnerNames.map((n, j) => <option key={j} value={n}>{n}</option>)}</select></div>
                <div style={{ flex: 1 }}><div style={lb}>장소</div><input value={x.location || ""} onChange={e => uf(x.id, "location", e.target.value)} placeholder="위치" list={"lo" + i} style={{ ...inpS(T1), padding: "10px", fontSize: 14 }} />{locs.length > 0 && <datalist id={"lo" + i}>{locs.map((n, j) => <option key={j} value={n} />)}</datalist>}</div>
                <div style={{ flex: 0.7 }}><div style={lb}>날짜</div><input type="date" value={x.date || ""} onChange={e => uf(x.id, "date", e.target.value)} style={{ ...inpS(T1), padding: "10px 6px", fontSize: 13 }} /></div>
              </div>
            </React.Fragment> : <div style={{ display: "flex", gap: 14, fontSize: 14, color: T2, paddingLeft: 38, marginBottom: 6 }}><span style={{ color: R }}>원가 {fmt(x.cost || 0)}</span><span style={{ color: G }}>판매 {fmt(x.sell || 0)}</span>{x.trader && <span>👤 {x.trader}</span>}{x.location && <span>📍 {x.location}</span>}</div>}
            <div style={{ display: "flex", gap: 10, fontSize: 13, color: T3, paddingLeft: 38 }}><span>누적 <b style={{ color: T2 }}>{x.cum}kg</b></span><span>{x.rd}회차</span><span style={{ color: O, fontWeight: 700 }}>{x.pg}/{s.unit}</span></div>
          </div>
        ); })}
        <div style={{ padding: "14px 20px", background: "#F8FAFC", display: "flex", justifyContent: "space-between", fontSize: 15, fontWeight: 800 }}><span style={{ color: T2 }}>합계</span><div style={{ display: "flex", gap: 14 }}><span style={{ color: O }}>{totalKg}kg</span><span style={{ color: R }}>{fmt(totalCost)}</span><span style={{ color: B }}>{fmt(totalSell)}</span><span style={{ color: profit >= 0 ? G : R }}>{fmt(profit)}</span></div></div>
      </div>}
    </div>
    </React.Fragment>
  );
}

// ===== useFirebaseSets: 실시간 리스너 =====
function useFirebaseSets() {
  const [sets, setSets] = useState([]);
  const [loaded, setLoaded] = useState(false);
  useEffect(() => {
    return fbListen("sets", val => {
      setSets(val ? Object.values(val) : []);
      setLoaded(true);
    });
  }, []);
  const saveSets = useCallback((newSets) => {
    const obj = {};
    newSets.forEach(s => { obj["s" + s.id] = s; });
    fbSet("sets", obj);
  }, []);
  return { sets, loaded, saveSets };
}

// ===== VIEWER =====
function Viewer({ code, onLogout }) {
  const { sets: allSets, loaded, saveSets } = useFirebaseSets();
  const [idx, setIdx] = useState(0);
  const mySets = allSets.filter(s => (s.viewers || []).some(v => v.code === code));
  const s = mySets[idx];

  const onSave = (ch) => {
    if (!s) return;
    const ns = allSets.map(x => x.id === s.id ? { ...x, ...ch } : x);
    saveSets(ns);
  };

  if (!loaded) return <div style={{ minHeight: "100vh", background: BG_, display: "flex", alignItems: "center", justifyContent: "center" }}><div style={{ color: T3 }}>로딩 중...</div></div>;
  if (!s) return <div style={{ minHeight: "100vh", background: BG_, display: "flex", alignItems: "center", justifyContent: "center" }}><div style={{ textAlign: "center", color: T3 }}><div style={{ marginBottom: 20 }}>배정된 세트가 없습니다</div><button onClick={onLogout} style={{ ...btnS("#F1F5F9", T2), width: "auto", padding: "12px 28px" }}>로그아웃</button></div></div>;

  return (
    <div style={{ minHeight: "100vh", maxWidth: 480, margin: "0 auto", background: BG_ }}>
      <div style={{ padding: "14px 18px", background: W, borderBottom: `1px solid ${BD}`, display: "flex", justifyContent: "space-between", alignItems: "center", position: "sticky", top: 0, zIndex: 50 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 18, fontWeight: 900, color: T1 }}>{(s.viewers || []).find(v => v.code === code)?.name || code}</span>

      <div style={{ padding: "16px 14px" }}>
        <SalesTab s={s} canEdit={true} onSave={onSave} partnerNames={(s.partners || []).map(p => p.name).filter(Boolean)} />
      </div>
    </div>
  );
}

        {tab === "accounts" && <React.Fragment>
          <div style={{ ...card, padding: 22 }}>

}

function App() {
  const [auth, setAuth] = useState(null);
  return (
    <FirebaseCheck>
      {!auth ? <Login onLogin={setAuth} /> :
       auth.role === "viewer" ? <Viewer code={auth.code} onLogout={() => setAuth(null)} /> :
       <Admin onLogout={() => setAuth(null)} />}
    </FirebaseCheck>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
